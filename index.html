<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/header-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Prompt Engineering Course Kerala | Monkey Tribe</title>
    <meta name="description" content="Join PromptX, a practical AI prompt engineering course in Kerala by Monkey Tribe and Creative Monkeys Advertising. Learn expert prompting, AI workflows, digital marketing, brand building, and copywriting with real-world training." />

    <!-- Queue analytics immediately, but keep the third-party download off the critical path. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GP7H2VV2PY');
      window.addEventListener('load', function () {
        var loadAnalytics = function () {
          if (document.querySelector('script[data-google-tag]')) return;
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-GP7H2VV2PY';
          script.dataset.googleTag = 'true';
          document.head.appendChild(script);
        };
        if ('requestIdleCallback' in window) window.requestIdleCallback(loadAnalytics, { timeout: 3500 });
        else window.setTimeout(loadAnalytics, 2000);
      }, { once: true });
    </script>

    <!-- Preload only the actual LCP image at the size needed by the viewport. -->
    <link rel="preload" as="image" href="/carosal-1-mobile.webp" imagesrcset="/carosal-1-mobile.webp 768w, /carosal-1-desktop.webp 1440w, /carosal-1.webp 1672w" imagesizes="100vw" type="image/webp" fetchpriority="high" />

    <!-- Warm up font connections — non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the Google Fonts stylesheet to fetch it immediately at high priority -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" />

    <!-- Load Google Fonts 100% async — zero render-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" />
    </noscript>

    <!-- Critical above-the-fold styles: paint the hero instantly before any JS loads -->
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;min-width:320px;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100svh}
      .home-page{margin:0;padding:0}
      .header{width:100%;height:112px;position:absolute;top:0;left:0;z-index:1000;display:flex;align-items:center;background:transparent}
      .header-container{width:90%;max-width:1720px;margin:0 auto;padding:0 clamp(24px,4vw,70px);display:flex;align-items:center;justify-content:space-between}
      .header-logo img{width:115px;object-fit:contain;cursor:pointer}
      .header-nav{display:flex;align-items:center;gap:clamp(16px,1.8vw,30px);flex:1;justify-content:center;margin:0 clamp(20px,2.5vw,40px)}
      .header-nav a{text-decoration:none;color:#2f1d13;font-size:15px;font-weight:500}
      .header-actions{display:flex;align-items:center;gap:20px}
      .explore-btn{border:none;background:transparent;color:#2d1a11;font-size:18px;font-weight:700;cursor:pointer;padding:0}
      .register-btn{border:none;background:#f8cb12;color:#000;padding:16px 28px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer}
      .header-hamburger{display:none;flex-direction:column;justify-content:space-between;width:26px;height:18px;background:transparent;border:none;cursor:pointer;padding:0}
      .hamburger-line{width:100%;height:2.5px;background:#2f1d13;border-radius:4px}
      .home-carousel{position:relative;width:100%;height:100svh;min-height:540px;overflow:hidden;isolation:isolate;background:#100555}
      .home-carousel__slides,.home-carousel__slide,.home-carousel__slide picture,.home-carousel__slide img{width:100%;height:100%}
      .home-carousel__slide{position:absolute;inset:0;opacity:0;visibility:hidden}
      .home-carousel__slide.is-active{opacity:1;visibility:visible}
      .home-carousel__slide picture,.home-carousel__slide img{display:block}
      .home-carousel__slide img{max-width:none;object-fit:cover;object-position:center;transform:scale(1.015)}
      .home-carousel__dots{position:absolute;z-index:3;left:50%;bottom:clamp(28px,4vh,50px);display:flex;align-items:center;gap:10px;transform:translateX(-50%)}
      .home-carousel__dot{width:10px;height:10px;padding:0;border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.34)}
      .home-carousel__dot.is-active{width:30px;background:#f8cb12;border-color:#f8cb12}
      .home-carousel__scroll{display:none}
      @media(max-width:992px){.header-nav{display:none}.header-actions{display:none!important}.header{height:90px}.header-logo img{width:90px}.header-hamburger{display:flex}}
      @media(max-width:720px){.home-carousel{min-height:500px}.home-carousel__slide img{object-position:34% center}.home-carousel__dots{bottom:38px}}
    </style>
  </head>
  <body>
    <!--
      Pre-rendered above-the-fold HTML: browser paints this INSTANTLY (FCP ~0.4s)
      before any JavaScript loads. React loads and takes over seamlessly.
    -->
    <div id="root">
      <main class="home-page">
        <header class="header">
          <div class="header-container">
            <div class="header-logo">
              <picture>
                <source type="image/webp" srcset="/header-logo-1x.webp 1x, /header-logo-2x.webp 2x" />
                <img src="/header-logo.png" alt="Monkey Tribe" width="115" height="144" />
              </picture>
            </div>
            <nav class="header-nav">
              <a href="#" class="active">Home</a>
              <a href="#">Courses</a>
              <a href="#">Programmes</a>
              <a href="#">Webinars</a>
              <a href="#">Blog</a>
              <a href="#">About</a>
              <a href="#">Contact</a>
            </nav>
            <div class="header-actions">
              <button class="explore-btn">Explore Courses</button>
              <button class="register-btn">Register Now</button>
            </div>
            <button class="header-hamburger" aria-label="Toggle Navigation Menu">
              <span class="hamburger-line"></span>
              <span class="hamburger-line"></span>
              <span class="hamburger-line"></span>
            </button>
          </div>
        </header>

        <section class="home-carousel" id="home" aria-label="Monkey Tribe highlights" aria-roledescription="carousel">
          <div class="home-carousel__slides" aria-live="off">
            <div class="home-carousel__slide is-active" aria-hidden="false">
              <picture>
                <source media="(max-width: 768px)" srcset="/carosal-1-mobile.webp" />
                <source media="(max-width: 1440px)" srcset="/carosal-1-desktop.webp" />
                <img src="/carosal-1.webp" alt="Artificial intelligence and digital creativity" width="1672" height="941" fetchpriority="high" loading="eager" decoding="async" />
              </picture>
            </div>
          </div>
          <div class="home-carousel__dots" aria-label="Choose a slide">
            <button class="home-carousel__dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
            <button class="home-carousel__dot" type="button" aria-label="Show slide 2"></button>
            <button class="home-carousel__dot" type="button" aria-label="Show slide 3"></button>
            <button class="home-carousel__dot" type="button" aria-label="Show slide 4"></button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
